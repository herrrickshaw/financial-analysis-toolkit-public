[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-analysis-toolkit"
version = "0.1.0"
description = "Financial modelling toolkit distilled from CFI templates: 3-statement, DCF, bottom-up projection, ratios, template extractor and catalog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
xls = ["xlrd>=2.0"]
test = ["pytest>=7"]

[project.scripts]
finmodel = "finmodel.cli:main"

[tool.setuptools.packages.find]
include = ["finmodel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200            # the engines use deliberately dense one-line formulas; do not reflow them
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]         # syntax errors and pyflakes; style rules are Phase 2
ignore = ["F841"]            # ~10 unused locals in dense legacy code: Phase 2
