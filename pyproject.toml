[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-analysis-toolkit"
version = "0.1.0"
description = "Financial modelling toolkit distilled from CFI templates: 3-statement, DCF, bottom-up projection, ratios, template extractor and catalog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
xls = ["xlrd>=2.0"]
test = ["pytest>=7"]

[project.scripts]
finmodel = "finmodel.cli:main"

[tool.setuptools.packages.find]
include = ["finmodel*"]
